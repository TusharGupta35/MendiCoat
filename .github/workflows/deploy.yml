name: Deploy to Azure VM

on:
  push:
    branches:
      - MendiCoatProd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/app
            git pull origin MendiCoatProd
            cp .env.production .env.local
            npm ci
            npx prisma generate
            pm2 stop mendicoat
            rm -rf .next
            npm run build
            pm2 restart mendicoat --update-env
            pm2 save
